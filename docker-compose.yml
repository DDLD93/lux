services:
  lux-api:
    build: .
    image: lux-api:latest
    ports:
      - "8080:8080"
    volumes:
      - lux-data:/data
    environment:
      LUX_OUTPUT_DIR: /data/downloads
      LUX_WORKERS: "4"
      LUX_ADDR: ":8080"
      LUX_SERVER_URL: "http://localhost:8080"
    restart: unless-stopped

volumes:
  lux-data:
